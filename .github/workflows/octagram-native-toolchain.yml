name: OCTAGRAM native toolchain (LLVM, rustc, cargo)

# Builds the native toolchain described in docs/rust-llvm-octagram-build.md and
# docs/rustc-native-bootstrap-runbook.md from a Linux host:
#
#   1. sysroot        make -C user sysroot + runtime link probes
#   2. libLLVM        static libLLVM for x86_64-unknown-octagram (M4.3.3)
#   3. rustc + cargo  bootstrap --host x86_64-unknown-octagram (M4.3.4)
#
# Pushes to the dedicated native-self-hosting branch run the complete build:
# sysroot -> static target libLLVM -> stage-2 native rustc + upstream Cargo.
# Pull requests run preflight only; the expensive full build can also be started
# manually with workflow_dispatch.
#
# Every produced binary is an OCTAGRAM ELF (static ET_EXEC, OCTAGRAM libc), so
# it cannot be executed on the runner. Verification here is static only:
# ELF type/machine, no PT_INTERP, installed archives present. Runtime behaviour
# still has to pass the QEMU gates in docs/rust-llvm-octagram-build.md §5.

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: "LLVM version to build (must match the pinned rust checkout)"
        required: false
        default: "21.1.0"
      jobs:
        description: "Parallel build jobs"
        required: false
        default: "4"
      build_llvm:
        description: "Build libLLVM (step 2)"
        type: boolean
        default: true
      rustc_mode:
        description: "rustc/cargo step: full build, prepare configs only, or skip"
        type: choice
        options:
          - full
          - prepare-only
          - skip
        default: full
  push:
    branches:
      - feature/native-self-hosting-testing-4
    paths:
      - "tools/build_llvm_octagram.sh"
      - "tools/bootstrap_rustc_octagram.sh"
      - "tools/octagram_llvm_config.py"
      - "tools/build_octagram_toolchain.sh"
      - "tools/stage_octagram_toolchain.sh"
      - "tools/stage_octagram_sysroot.py"
      - "tools/check_octagram_runtime_probes.sh"
      - "tools/check_octagram_rust_target_sync.py"
      - "tools/apply_rust_octagram_host_target.py"
      - "tools/apply_rust_libc_octagram.py"
      - "tools/patch_rust_std_octagram.py"
      - "tools/toolchain-probes/**"
      - "patches/rust/**"
      - "patches/libc/**"
      - "patches/rust-std/**"
      - "patches/rust-libc/**"
      - "user/Makefile"
      - "user/toolchain/**"
      - "user/third_party/libcxx/**"
      - ".github/workflows/octagram-native-toolchain.yml"
  pull_request:
    paths:
      - "tools/build_llvm_octagram.sh"
      - "tools/bootstrap_rustc_octagram.sh"
      - "tools/octagram_llvm_config.py"
      - "tools/build_octagram_toolchain.sh"
      - "tools/stage_octagram_toolchain.sh"
      - "tools/stage_octagram_sysroot.py"
      - "tools/check_octagram_runtime_probes.sh"
      - "tools/check_octagram_rust_target_sync.py"
      - "tools/apply_rust_octagram_host_target.py"
      - "tools/apply_rust_libc_octagram.py"
      - "tools/patch_rust_std_octagram.py"
      - "tools/toolchain-probes/**"
      - "patches/rust/**"
      - "patches/libc/**"
      - "patches/rust-std/**"
      - "patches/rust-libc/**"
      - "user/Makefile"
      - "user/toolchain/**"
      - "user/third_party/libcxx/**"
      - ".github/workflows/octagram-native-toolchain.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Stage0 toolchain for host-side helpers (fmt/check of the kernel, probes).
  OCTAGRAM_RUST_TOOLCHAIN: nightly-2026-11-23
  # Bumped together with the pinned rust checkout; build_llvm_octagram.sh fails
  # loudly when the extracted source disagrees with this major version.
  OCTAGRAM_LLVM_VERSION: "21.1.0"
  # Same pins as tools/bootstrap_rustc_octagram.sh. libc is checked out as a
  # sibling tree when apply_rust_libc_octagram.py patches the target module.
  OCTAGRAM_LIBC_PIN: ccc2ff4aaab962f7fde7b8edda7379c045b1ca12

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight (sysroot, runtime probes, target sync)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils lld nasm cmake ninja-build \
            python3 curl git ca-certificates

      - name: Validate shell scripts parse
        run: |
          set -euo pipefail
          for script in tools/build_octagram_toolchain.sh \
                        tools/build_llvm_octagram.sh \
                        tools/bootstrap_rustc_octagram.sh \
                        tools/stage_octagram_toolchain.sh \
                        tools/check_octagram_llvm_config.sh \
                        tools/check_octagram_runtime_probes.sh; do
            sh -n "$script"
            sh "$script" --help >/dev/null
            echo "PASS sh -n + --help: $script"
          done

      - name: Install Rust nightly
        run: |
          rustup toolchain install "$OCTAGRAM_RUST_TOOLCHAIN" --profile minimal
          rustc "+$OCTAGRAM_RUST_TOOLCHAIN" -vV

      - name: Validate experimental OCTAGRAM Rust host target
        run: |
          set -euo pipefail
          python3 tools/check_octagram_rust_target.py
          python3 tools/check_octagram_rust_target_sync.py

      - name: Build OCTAGRAM sysroot
        run: make -C user sysroot -j "$(nproc)"

      - name: Verify sysroot manifest
        run: |
          set -euo pipefail
          sysroot=user/build/sysroot-octagram
          test -s "$sysroot/sysroot.json"
          test -s "$sysroot/usr/lib/libc++.a"
          test -s "$sysroot/usr/lib/libc.a"
          test -s "$sysroot/usr/lib/libcxxrt.a"
          test -s "$sysroot/usr/lib/crt0.o"
          # Conventional Unix library names. Without them CMake links `-lm`
          # against the build host's static glibc and the link fails on a TLS
          # model mismatch.
          for alias in libm.a librt.a libdl.a libpthread.a; do
            test -s "$sysroot/usr/lib/$alias" || { echo "missing $alias"; exit 1; }
          done
          python3 - <<'PY'
          import json
          from pathlib import Path

          doc = json.loads(Path("user/build/sysroot-octagram/sysroot.json").read_text())
          files = doc.get("files", doc)
          count = len(files) if isinstance(files, (dict, list)) else 0
          print(f"SYSROOT-OK: {count} entri di sysroot.json")
          if count == 0:
              raise SystemExit("sysroot.json tidak mencatat satu file pun")
          PY

      - name: Link OCTAGRAM runtime probes (gates the LLVM build)
        run: tools/check_octagram_runtime_probes.sh

      - name: Check fcntl command numbers are distinct
        # F_DUPFD_CLOEXEC once shared 5 with F_GETLK, which sent duplicate calls
        # into the struct flock pointer path. The guest syscall test caught it.
        run: python3 tools/check_octagram_fcntl_commands.py

      - name: Check the host-runnable llvm-config (fixture, no LLVM build)
        # bootstrap executes llvm-config on the build machine, so this verifies
        # the generated script and the preflight that consumes it before any
        # multi-hour LLVM job runs. The same check runs against a real LLVM
        # component manifest in octagram-llvm-config.yml.
        run: tools/check_octagram_llvm_config.sh

      - name: Upload sysroot for the toolchain jobs
        uses: actions/upload-artifact@v4
        with:
          name: octagram-sysroot
          path: user/build/sysroot-octagram
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  llvm:
    name: libLLVM ${{ inputs.llvm_version || '21.1.0' }} (x86_64-unknown-octagram)
    needs: preflight
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      LLVM_VERSION: ${{ inputs.llvm_version || '21.1.0' }}
      JOBS: ${{ inputs.jobs || '4' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++ binutils lld cmake ninja-build \
            python3 curl git ca-certificates

      - name: Free disk space
        # The static X86-only LLVM build plus its install tree does not fit the
        # default ~14 GiB runner disk alongside the preinstalled toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean

      - name: Download sysroot
        uses: actions/download-artifact@v4
        with:
          name: octagram-sysroot
          path: user/build/sysroot-octagram

      - name: Restore LLVM source tarball
        uses: actions/cache@v4
        with:
          path: build/toolchain/llvm-${{ env.LLVM_VERSION }}.src.tar.xz
          key: octagram-llvm-src-${{ env.LLVM_VERSION }}-${{ hashFiles('tools/build_llvm_octagram.sh') }}

      - name: Restore libLLVM install tree
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: build/toolchain/llvm-${{ env.LLVM_VERSION }}-octagram
          key: octagram-llvm-install-${{ env.LLVM_VERSION }}-${{ hashFiles('tools/build_llvm_octagram.sh', 'tools/octagram_llvm_config.py', 'user/toolchain/**', 'user/Makefile') }}

      - name: Require cached libLLVM when build_llvm is off
        if: inputs.build_llvm == false && steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          echo "build_llvm=false tetapi tidak ada libLLVM $LLVM_VERSION di cache." >&2
          echo "Jalankan workflow dengan build_llvm=true sekali untuk mengisinya." >&2
          exit 1

      - name: Build libLLVM
        if: (github.event_name != 'workflow_dispatch' || inputs.build_llvm) && steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tools/build_llvm_octagram.sh \
            --llvm-version "$LLVM_VERSION" \
            --jobs "$JOBS"
          # Build tree + extracted source are several GiB and are not needed
          # after install; the source tarball is kept for the next cache save.
          rm -rf "build/toolchain/llvm-$LLVM_VERSION/llvm-project-$LLVM_VERSION.src" \
                 "build/toolchain/llvm-$LLVM_VERSION/build-octagram"

      - name: Verify libLLVM install (static OCTAGRAM ELF)
        run: |
          set -euo pipefail
          prefix="build/toolchain/llvm-$LLVM_VERSION-octagram"
          fail=0
          for tool in llvm-config llc llvm-nm; do
            binary="$prefix/bin/$tool"
            if [ ! -x "$binary" ]; then
              echo "FAIL: $binary is missing"; fail=1; continue
            fi
            tool_failed=0
            header=$(readelf -h "$binary")
            echo "$header" | grep -q 'Type:.*EXEC (' \
              || { echo "FAIL: $tool is not ET_EXEC"; tool_failed=1; }
            echo "$header" | grep -q 'Machine:.*X86-64' \
              || { echo "FAIL: $tool is not x86-64"; tool_failed=1; }
            if readelf -l "$binary" | grep -q 'INTERP'; then
              echo "FAIL: $tool has a PT_INTERP dynamic loader"; tool_failed=1
            fi
            if readelf -l "$binary" | grep -q 'DYNAMIC'; then
              echo "FAIL: $tool has a PT_DYNAMIC segment"; tool_failed=1
            fi
            if [ "$tool_failed" -eq 0 ]; then
              echo "PASS static OCTAGRAM ELF: $tool"
            else
              fail=1
            fi
          done
          test -n "$(ls "$prefix"/lib/libLLVM*.a 2>/dev/null)" \
            || { echo "FAIL: no libLLVM*.a in $prefix/lib"; fail=1; }
          # bin/llvm-config is a target ELF, so the rustc job queries the
          # host-runnable replacement. It is a script, so it can be exercised
          # here instead of only inside the guest.
          host_config="$prefix/bin/octagram-llvm-config"
          if [ ! -x "$host_config" ]; then
            echo "FAIL: $host_config is missing"; fail=1
          else
            reported=$("$host_config" --version 2>/dev/null || true)
            [ "$reported" = "$LLVM_VERSION" ] \
              || { echo "FAIL: octagram-llvm-config reports '$reported'"; fail=1; }
            library_count=$("$host_config" --libs 2>/dev/null | wc -w | tr -d ' ')
            [ "${library_count:-0}" -gt 0 ] \
              || { echo "FAIL: octagram-llvm-config reported no libraries"; fail=1; }
            "$host_config" --libs core support 2>/dev/null | grep -q -- '-lLLVMCore ' \
              || { echo "FAIL: octagram-llvm-config --libs core support is wrong"; fail=1; }
            "$host_config" --libs 2>/dev/null | tr ' ' '\n' | tail -1 | grep -qx -- '-lLLVMDemangle' \
              || { echo "FAIL: leaf libraries are not last in --libs"; fail=1; }
            echo "PASS host-runnable llvm-config: $reported, $library_count libraries"
          fi
          ls -l "$prefix/lib" | head -20
          [ "$fail" -eq 0 ] || exit 1

      - name: Upload libLLVM
        uses: actions/upload-artifact@v4
        with:
          name: octagram-llvm-${{ env.LLVM_VERSION }}
          path: build/toolchain/llvm-${{ env.LLVM_VERSION }}-octagram
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  rustc-cargo:
    name: rustc + cargo for x86_64-unknown-octagram
    needs: [preflight, llvm]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (inputs.rustc_mode || 'full') != 'skip'
    runs-on: ubuntu-latest
    # The full bootstrap (stage2 rustc + upstream Cargo for the OCTAGRAM host)
    # is expensive; it runs on pushes to this dedicated branch and manually.
    # Keep the ceiling explicit so a hung x.py fails rather than timing out.
    timeout-minutes: 355
    env:
      LLVM_VERSION: ${{ inputs.llvm_version || '21.1.0' }}
      JOBS: ${{ inputs.jobs || '4' }}
      RUSTC_MODE: ${{ inputs.rustc_mode || 'full' }}
    steps:
      - name: Checkout OCTAGRAM-OS
        uses: actions/checkout@v4

      - name: Checkout pinned upstream libc (target_os = "octagram" module)
        uses: actions/checkout@v4
        with:
          repository: rust-lang/libc
          ref: ${{ env.OCTAGRAM_LIBC_PIN }}
          path: upstream-libc

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++ binutils lld cmake ninja-build \
            python3 curl git ca-certificates

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean

      - name: Install host LLVM for the build platform
        # bootstrap runs llvm-config on the runner while building the compiler
        # for x86_64-unknown-linux-gnu; the OCTAGRAM install only describes the
        # target. The static archives from llvm-<major>-dev are required.
        run: |
          set -euo pipefail
          major=${LLVM_VERSION%%.*}
          find_config() {
            for candidate in "llvm-config-$major" "/usr/lib/llvm-$major/bin/llvm-config"; do
              if command -v "$candidate" >/dev/null 2>&1; then
                echo "$(command -v "$candidate")"; return 0
              fi
              if [ -x "$candidate" ]; then echo "$candidate"; return 0; fi
            done
            return 1
          }
          config=$(find_config || true)
          if [ -z "$config" ]; then
            echo "llvm-$major-dev not installed yet; trying apt"
            sudo apt-get install -y "llvm-$major-dev" || true
            config=$(find_config || true)
          fi
          if [ -z "$config" ]; then
            echo "llvm-$major-dev unavailable; downloading LLVM $LLVM_VERSION release"
            url="https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-Linux-X64.tar.xz"
            curl -fL --retry 3 -o /tmp/llvm-host.tar.xz "$url"
            sudo mkdir -p /opt/llvm-host
            sudo tar -xJf /tmp/llvm-host.tar.xz -C /opt/llvm-host --strip-components=1
            rm -f /tmp/llvm-host.tar.xz
            config=/opt/llvm-host/bin/llvm-config
          fi
          [ -x "$config" ] || { echo "FAIL: no host llvm-config" >&2; exit 1; }
          reported=$("$config" --version)
          case "$reported" in
            "$major".*) ;;
            *) echo "FAIL: host LLVM $reported does not match major $major" >&2; exit 1 ;;
          esac
          echo "HOST_LLVM_CONFIG=$config" >> "$GITHUB_ENV"
          echo "host llvm-config: $config ($reported)"

      - name: Install Rust stage0 toolchain
        run: |
          rustup toolchain install "$OCTAGRAM_RUST_TOOLCHAIN" \
            --profile minimal --component rustfmt
          rustup default "$OCTAGRAM_RUST_TOOLCHAIN"
          rustc -vV

      - name: Download sysroot
        uses: actions/download-artifact@v4
        with:
          name: octagram-sysroot
          path: user/build/sysroot-octagram

      - name: Download libLLVM
        uses: actions/download-artifact@v4
        with:
          name: octagram-llvm-${{ env.LLVM_VERSION }}
          path: build/toolchain/llvm-${{ env.LLVM_VERSION }}-octagram

      - name: Prepare rustc bootstrap
        if: env.RUSTC_MODE == 'prepare-only'
        run: |
          set -euo pipefail
          tools/bootstrap_rustc_octagram.sh \
            --llvm-prefix "build/toolchain/llvm-$LLVM_VERSION-octagram" \
            --host-llvm-config "$HOST_LLVM_CONFIG" \
            --libc-checkout upstream-libc \
            --jobs "$JOBS"

      - name: Build rustc and cargo for OCTAGRAM
        if: env.RUSTC_MODE == 'full'
        run: |
          set -euo pipefail
          tools/bootstrap_rustc_octagram.sh \
            --llvm-prefix "build/toolchain/llvm-$LLVM_VERSION-octagram" \
            --host-llvm-config "$HOST_LLVM_CONFIG" \
            --libc-checkout upstream-libc \
            --jobs "$JOBS" \
            --build

      - name: Verify staged toolchain
        if: env.RUSTC_MODE == 'full'
        run: |
          set -euo pipefail
          stage=build/toolchain/octagram-toolchain
          test -s "$stage/toolchain.json"
          cat "$stage/toolchain.json"
          for tool in rustc cargo; do
            binary="$stage/bin/$tool"
            [ -f "$binary" ] || { echo "FAIL: $binary missing"; exit 1; }
            header=$(readelf -h "$binary")
            echo "$header" | grep -q 'Type:.*EXEC (' \
              || { echo "FAIL: $tool is not ET_EXEC"; exit 1; }
            echo "$header" | grep -q 'Machine:.*X86-64' \
              || { echo "FAIL: $tool is not x86-64"; exit 1; }
            if readelf -l "$binary" | grep -q 'INTERP'; then
              echo "FAIL: $tool has a PT_INTERP"; exit 1
            fi
            echo "PASS static OCTAGRAM ELF: $tool"
          done
          test -d "$stage/lib/rustlib" \
            || { echo "FAIL: rustlib missing"; exit 1; }
          echo "TOOLCHAIN-VERIFY-PASS"

      - name: Upload rustc + cargo
        if: env.RUSTC_MODE == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: octagram-toolchain
          path: build/toolchain/octagram-toolchain
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  status-summary:
    name: Toolchain status summary
    runs-on: ubuntu-latest
    needs: [preflight, llvm, rustc-cargo]
    if: always()
    steps:
      - name: Report job results
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          LLVM_RESULT: ${{ needs.llvm.result }}
          RUSTC_RESULT: ${{ needs.rustc-cargo.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "STATUS event=${EVENT}"
          echo "STATUS preflight=${PREFLIGHT_RESULT}"
          # skipped = build tidak diminta untuk event ini, bukan gagal.
          echo "STATUS llvm=${LLVM_RESULT}"
          echo "STATUS rustc-cargo=${RUSTC_RESULT}"
          echo "STATUS guest-runtime=not-run (butuh QEMU; lihat docs/rust-llvm-octagram-build.md)"
          if [ "${PREFLIGHT_RESULT}" != "success" ]; then
            echo "STATUS overall=failed"
            exit 1
          fi
          for result in "${LLVM_RESULT}" "${RUSTC_RESULT}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "STATUS overall=failed"; exit 1 ;;
            esac
          done
          echo "STATUS overall=passed"
