name: OCTAGRAM native toolchain (LLVM, rustc, cargo)

# Builds the native toolchain described in docs/rust-llvm-octagram-build.md and
# docs/rustc-native-bootstrap-runbook.md from a Linux host:
#
#   1. sysroot        make -C user sysroot + runtime link probes
#   2. libLLVM        static libLLVM for x86_64-unknown-octagram (M4.3.3)
#   3. rustc + cargo  bootstrap --host x86_64-unknown-octagram (M4.3.4)
#
# Pushes to the dedicated native-self-hosting branch run the complete build:
# sysroot -> static target libLLVM -> stage-2 native rustc + upstream Cargo.
# Pull requests run preflight only; the expensive full build can also be started
# manually with workflow_dispatch.
#
# Every produced binary is an OCTAGRAM ELF (static ET_EXEC, OCTAGRAM libc), so
# it cannot be executed on the runner. Verification here is static only:
# ELF type/machine, no PT_INTERP, installed archives present. Runtime behaviour
# still has to pass the QEMU gates in docs/rust-llvm-octagram-build.md §5.

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: "LLVM version to build (must match the pinned rust checkout)"
        required: false
        # bootstrap at the pinned rust checkout panics on anything older:
        # check_llvm_version() in src/bootstrap/src/core/build_steps/llvm.rs
        # requires the external llvm-config to report major >= 22.
        default: "22.1.8"
      jobs:
        description: "Parallel build jobs"
        required: false
        default: "4"
      build_llvm:
        description: "Build libLLVM (step 2)"
        type: boolean
        default: true
      rustc_mode:
        description: "rustc/cargo step: full build, prepare configs only, or skip"
        type: choice
        options:
          - full
          - prepare-only
          - skip
        default: full
      time_budget:
        description: "Build minutes per run before a checkpoint is saved (LLVM and rustc; keep below timeout-minutes)"
        required: false
        default: "270"
      fresh_build:
        description: "Ignore any saved LLVM build checkpoint and start from scratch"
        type: boolean
        default: false
  push:
    branches:
      - feature/native-self-hosting-testing-4
    paths:
      - "tools/build_llvm_octagram.sh"
      - "tools/bootstrap_rustc_octagram.sh"
      - "tools/octagram_llvm_config.py"
      - "tools/check_octagram_llvm_ci.py"
      - "tools/build_octagram_toolchain.sh"
      - "tools/stage_octagram_toolchain.sh"
      - "tools/stage_octagram_sysroot.py"
      - "tools/check_octagram_runtime_probes.sh"
      - "tools/check_octagram_cmake_threads.sh"
      - "tools/check_octagram_rust_target_sync.py"
      - "tools/apply_rust_octagram_host_target.py"
      - "tools/apply_rust_libc_octagram.py"
      - "tools/patch_rust_std_octagram.py"
      - "tools/patch_getrandom_octagram.py"
      - "tools/patch_errno_octagram.py"
      - "tools/patch_tempfile_octagram.py"
      - "tools/patch_filetime_octagram.py"
      - "tools/check_rust_stage2_deps.sh"
      - "tools/toolchain-probes/**"
      - "patches/rust/**"
      - "patches/libc/**"
      - "patches/rust-std/**"
      - "patches/rust-libc/**"
      - "user/**"
      - ".github/workflows/octagram-native-toolchain.yml"
  pull_request:
    paths:
      - "tools/build_llvm_octagram.sh"
      - "tools/bootstrap_rustc_octagram.sh"
      - "tools/octagram_llvm_config.py"
      - "tools/check_octagram_llvm_ci.py"
      - "tools/build_octagram_toolchain.sh"
      - "tools/stage_octagram_toolchain.sh"
      - "tools/stage_octagram_sysroot.py"
      - "tools/check_octagram_runtime_probes.sh"
      - "tools/check_octagram_rust_target_sync.py"
      - "tools/apply_rust_octagram_host_target.py"
      - "tools/apply_rust_libc_octagram.py"
      - "tools/patch_rust_std_octagram.py"
      - "tools/patch_getrandom_octagram.py"
      - "tools/patch_errno_octagram.py"
      - "tools/patch_tempfile_octagram.py"
      - "tools/patch_filetime_octagram.py"
      - "tools/check_rust_stage2_deps.sh"
      - "tools/toolchain-probes/**"
      - "patches/rust/**"
      - "patches/libc/**"
      - "patches/rust-std/**"
      - "patches/rust-libc/**"
      - "user/**"
      - ".github/workflows/octagram-native-toolchain.yml"

concurrency:
  # Only one native-toolchain run may use the branch's checkpoint/cache at a time.
  # A newer commit supersedes queued or running work; the LLVM build script
  # handles cancellation by stopping Ninja before the checkpoint-save step.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Stage0 toolchain for host-side helpers (fmt/check of the kernel, probes).
  OCTAGRAM_RUST_TOOLCHAIN: nightly-2026-11-23
  # Bumped together with the pinned rust checkout; build_llvm_octagram.sh fails
  # loudly when the extracted source disagrees with this major version.
  OCTAGRAM_LLVM_VERSION: "22.1.8"
  # Same pins as tools/bootstrap_rustc_octagram.sh. libc is checked out as a
  # sibling tree when apply_rust_libc_octagram.py patches the target module.
  OCTAGRAM_LIBC_PIN: ccc2ff4aaab962f7fde7b8edda7379c045b1ca12

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight (sysroot, runtime probes, target sync)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils lld nasm cmake ninja-build \
            python3 curl git ca-certificates

      - name: Validate shell scripts parse
        run: |
          set -euo pipefail
          for script in tools/build_octagram_toolchain.sh \
                        tools/build_llvm_octagram.sh \
                        tools/bootstrap_rustc_octagram.sh \
                        tools/stage_octagram_toolchain.sh \
                        tools/check_octagram_llvm_config.sh \
                        tools/check_octagram_runtime_probes.sh \
                        tools/check_octagram_cmake_threads.sh; do
            sh -n "$script"
            sh "$script" --help >/dev/null
            echo "PASS sh -n + --help: $script"
          done

      - name: Check resumable LLVM CI contract
        run: python3 tools/check_octagram_llvm_ci.py

      - name: Check host llvm-config adapter
        run: python3 tools/host_llvm_config_wrapper.py --self-test

      - name: Install Rust nightly
        run: |
          rustup toolchain install "$OCTAGRAM_RUST_TOOLCHAIN" --profile minimal --component rust-src
          rustc "+$OCTAGRAM_RUST_TOOLCHAIN" -vV

      - name: Validate experimental OCTAGRAM Rust host target
        run: |
          set -euo pipefail
          python3 tools/check_octagram_rust_target.py
          python3 tools/check_octagram_rust_target_sync.py

      - name: Check Rust stage-2 dependency compatibility (no LLVM build)
        run: sh tools/check_rust_stage2_deps.sh

      - name: Build OCTAGRAM sysroot
        run: make -C user sysroot -j "$(nproc)"

      - name: Verify sysroot manifest
        run: |
          set -euo pipefail
          sysroot=user/build/sysroot-octagram
          test -s "$sysroot/sysroot.json"
          test -s "$sysroot/usr/lib/libc++.a"
          test -s "$sysroot/usr/lib/libc.a"
          test -s "$sysroot/usr/lib/libcxxrt.a"
          test -s "$sysroot/usr/lib/crt0.o"
          # Conventional Unix library names. Without them CMake links `-lm`
          # against the build host's static glibc and the link fails on a TLS
          # model mismatch.
          for alias in libm.a librt.a libdl.a libpthread.a; do
            test -s "$sysroot/usr/lib/$alias" || { echo "missing $alias"; exit 1; }
          done
          python3 - <<'PY'
          import json
          from pathlib import Path

          doc = json.loads(Path("user/build/sysroot-octagram/sysroot.json").read_text())
          files = doc.get("files", doc)
          count = len(files) if isinstance(files, (dict, list)) else 0
          print(f"SYSROOT-OK: {count} entri di sysroot.json")
          if count == 0:
              raise SystemExit("sysroot.json tidak mencatat satu file pun")
          PY

      - name: Link OCTAGRAM runtime probes (gates the LLVM build)
        run: tools/check_octagram_runtime_probes.sh

      - name: Check fcntl command numbers are distinct
        # F_DUPFD_CLOEXEC once shared 5 with F_GETLK, which sent duplicate calls
        # into the struct flock pointer path. The guest syscall test caught it.
        run: python3 tools/check_octagram_fcntl_commands.py

      - name: Check target CMake pthread detection
        # FindThreads must use OCTAGRAM libc.a, not invent a -lpthreads library.
        run: sh tools/check_octagram_cmake_threads.sh

      - name: Check the host-runnable llvm-config (fixture, no LLVM build)
        # bootstrap executes llvm-config on the build machine, so this verifies
        # the generated script and the preflight that consumes it before any
        # multi-hour LLVM job runs. The same check runs against a real LLVM
        # component manifest in octagram-llvm-config.yml.
        run: tools/check_octagram_llvm_config.sh

      - name: Upload sysroot for the toolchain jobs
        uses: actions/upload-artifact@v4
        with:
          name: octagram-sysroot
          path: user/build/sysroot-octagram
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  llvm:
    name: libLLVM ${{ inputs.llvm_version || '22.1.8' }} (x86_64-unknown-octagram)
    needs: preflight
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # GitHub terminates a hosted job at six hours and never runs the remaining
    # steps, so the build stops itself earlier (--time-budget) and saves a
    # checkpoint; the next run restores it and continues. The ceiling leaves
    # room for setup, cache restore and the checkpoint save.
    timeout-minutes: 350
    env:
      LLVM_VERSION: ${{ inputs.llvm_version || '22.1.8' }}
      JOBS: ${{ inputs.jobs || '4' }}
      TIME_BUDGET: ${{ inputs.time_budget || '270' }}
    outputs:
      incomplete: ${{ steps.llvm-build.outputs.incomplete }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++ binutils lld cmake ninja-build \
            python3 curl git ca-certificates

      - name: Free disk space
        # The static X86-only LLVM build plus its install tree does not fit the
        # default ~14 GiB runner disk alongside the preinstalled toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean

      - name: Download sysroot
        uses: actions/download-artifact@v4
        with:
          name: octagram-sysroot
          path: user/build/sysroot-octagram

      - name: Restore LLVM source tarball
        # Path must match where build_llvm_octagram.sh keeps the download
        # (build/toolchain/llvm-<ver>/llvm-project-<ver>.src.tar.xz); the old
        # path never existed, so every run downloaded it again.
        # The key is the version alone: the file is the pinned upstream release
        # archive, so edits to our own script never change it. Hashing the
        # script here made every edit download 1.3 GB again.
        uses: actions/cache@v4
        with:
          path: build/toolchain/llvm-${{ env.LLVM_VERSION }}/llvm-project-${{ env.LLVM_VERSION }}.src.tar.xz
          key: octagram-llvm-src-${{ env.LLVM_VERSION }}

      - name: Compute exact LLVM build input fingerprint
        id: llvm-inputs
        # Use the same stamp that build_llvm_octagram.sh writes into the
        # verified install. This includes the actual downloaded sysroot tree,
        # not merely the source files used to produce it.
        run: |
          set -euo pipefail
          stamp=$(tools/build_llvm_octagram.sh \
            --llvm-version "$LLVM_VERSION" --print-build-inputs-stamp)
          if ! [[ "$stamp" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid LLVM build input fingerprint: $stamp" >&2
            exit 1
          fi
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "LLVM-INPUT-FINGERPRINT: $stamp"

      - name: Restore libLLVM install tree
        id: llvm-cache
        # Restore-only: a partial install must never be saved under this key,
        # or the next run would skip the build and ship an incomplete prefix.
        # The matching save step runs after the verifier accepts the tree.
        uses: actions/cache/restore@v4
        with:
          path: build/toolchain/llvm-${{ env.LLVM_VERSION }}-octagram
          key: octagram-llvm-install-${{ env.LLVM_VERSION }}-${{ steps.llvm-inputs.outputs.stamp }}
          # The key is the exact build-input stamp checked by the build script.
          # Do not use a broad restore prefix here: an install built against a
          # different sysroot must not be restored and then thrown away.

      - name: Verify the restored libLLVM inputs
        id: llvm-install
        # The exact-stamp cache key should only restore a compatible tree, but
        # keep this verification as a defence against a damaged or manually
        # populated cache before the prefix is ever linked into rustc.
        run: |
          set -euo pipefail
          prefix="build/toolchain/llvm-$LLVM_VERSION-octagram"
          if [ ! -d "$prefix" ]; then
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "no restored libLLVM tree"
            exit 0
          fi
          if tools/build_llvm_octagram.sh --check-install-inputs \
               --llvm-version "$LLVM_VERSION" --prefix "$prefix"; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "discarding $prefix: it was built from different inputs"
            rm -rf "$prefix"
          fi

      - name: Restore libLLVM build checkpoint
        id: llvm-build-cache
        # The fingerprint is identical to the build's verified input stamp.
        # The run id makes cache entries immutable while restore-keys can find
        # the newest checkpoint only for this exact LLVM/sysroot/config tuple.
        uses: actions/cache/restore@v4
        with:
          path: build/toolchain/llvm-${{ env.LLVM_VERSION }}/build-octagram
          key: octagram-llvm-build-${{ env.LLVM_VERSION }}-${{ steps.llvm-inputs.outputs.stamp }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            octagram-llvm-build-${{ env.LLVM_VERSION }}-${{ steps.llvm-inputs.outputs.stamp }}-

      - name: Require cached libLLVM when build_llvm is off
        # The build_llvm input exists only for workflow_dispatch. On push,
        # inputs.build_llvm is unset (not an instruction to disable the build).
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.build_llvm == false &&
          steps.llvm-install.outputs.usable != 'true'
        run: |
          echo "build_llvm=false tetapi tidak ada libLLVM $LLVM_VERSION di cache." >&2
          echo "Jalankan workflow dengan build_llvm=true sekali untuk mengisinya." >&2
          exit 1

      - name: Build libLLVM (time-budgeted, resumable)
        id: llvm-build
        # Push always builds LLVM; manual runs may explicitly reuse a cache.
        if: (github.event_name != 'workflow_dispatch' || inputs.build_llvm == true) && steps.llvm-install.outputs.usable != 'true'
        run: |
          set -euo pipefail
          args=(--llvm-version "$LLVM_VERSION" --jobs "$JOBS" --time-budget "$TIME_BUDGET")
          tree="build/toolchain/llvm-$LLVM_VERSION/build-octagram"
          if [ -f "$tree/CMakeCache.txt" ]; then
            args+=(--resume)
            echo "RESUME: continuing the restored build tree ($tree)"
          fi
          if [ "${FRESH_BUILD:-false}" = "true" ]; then
            args+=(--clean)
            echo "FRESH-BUILD: discarding the restored build tree"
          fi
          status=0
          tools/build_llvm_octagram.sh "${args[@]}" || status=$?
          if [ "$status" -eq 75 ]; then
            # Exit 75 is the script saying "stopped at the budget, tree intact".
            # Reporting it as a job failure would hide that the next run can
            # continue, and a failed job still runs the checkpoint save below.
            echo "incomplete=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=LLVM build incomplete::Time budget ${TIME_BUDGET}m reached. The build tree is saved as a checkpoint; run this workflow again to continue from it."
            exit 0
          fi
          echo "incomplete=false" >> "$GITHUB_OUTPUT"
          exit "$status"
        env:
          FRESH_BUILD: ${{ inputs.fresh_build }}

      - name: Check for a build checkpoint to save
        id: checkpoint
        if: always()
        run: |
          tree="build/toolchain/llvm-$LLVM_VERSION/build-octagram"
          if [ -f "$tree/build.ninja" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            du -sh "$tree" || true
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save libLLVM build checkpoint
        # Save both budget-stopped builds and user-cancelled builds. The build
        # script traps cancellation signals and stops Ninja before the runner
        # reaches this step; the cache tree is therefore quiescent.
        if: >-
          always() &&
          steps.checkpoint.outputs.present == 'true' &&
          (steps.llvm-build.outputs.incomplete == 'true' || steps.llvm-build.outcome == 'cancelled' || cancelled())
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/toolchain/llvm-${{ env.LLVM_VERSION }}/build-octagram
          key: ${{ steps.llvm-build-cache.outputs.cache-primary-key }}

      - name: Remove the extracted LLVM source
        # The tarball is cached; a resumed run extracts it again with the
        # archive's own mtimes, so ninja does not treat every object as stale.
        if: always()
        run: rm -rf "build/toolchain/llvm-$LLVM_VERSION/llvm-project-$LLVM_VERSION.src"

      - name: Remove the build tree after a finished build
        # Only an unfinished build needs the tree. Dropping it here keeps the
        # runner disk free for the install tree and the artifact upload.
        if: success() && steps.llvm-build.outputs.incomplete != 'true'
        run: rm -rf "build/toolchain/llvm-$LLVM_VERSION/build-octagram"

      - name: Verify libLLVM install (static OCTAGRAM ELF)
        # Nothing to verify when this run stopped at the budget; the checkpoint
        # save below is what matters, and the next run finishes the install.
        if: success() && steps.llvm-build.outputs.incomplete != 'true'
        run: |
          set -euo pipefail
          prefix="build/toolchain/llvm-$LLVM_VERSION-octagram"
          fail=0
          for tool in llvm-config llc llvm-nm llvm-cov; do
            binary="$prefix/bin/$tool"
            if [ ! -x "$binary" ]; then
              echo "FAIL: $binary is missing"; fail=1; continue
            fi
            tool_failed=0
            header=$(readelf -h "$binary")
            echo "$header" | grep -q 'Type:.*EXEC (' \
              || { echo "FAIL: $tool is not ET_EXEC"; tool_failed=1; }
            echo "$header" | grep -q 'Machine:.*X86-64' \
              || { echo "FAIL: $tool is not x86-64"; tool_failed=1; }
            if readelf -l "$binary" | grep -q 'INTERP'; then
              echo "FAIL: $tool has a PT_INTERP dynamic loader"; tool_failed=1
            fi
            if readelf -l "$binary" | grep -q 'DYNAMIC'; then
              echo "FAIL: $tool has a PT_DYNAMIC segment"; tool_failed=1
            fi
            if [ "$tool_failed" -eq 0 ]; then
              echo "PASS static OCTAGRAM ELF: $tool"
            else
              fail=1
            fi
          done
          test -n "$(ls "$prefix"/lib/libLLVM*.a 2>/dev/null)" \
            || { echo "FAIL: no libLLVM*.a in $prefix/lib"; fail=1; }
          # bin/llvm-config is a target ELF, so the rustc job queries the
          # host-runnable replacement. It is a script, so it can be exercised
          # here instead of only inside the guest.
          host_config="$prefix/bin/octagram-llvm-config"
          if [ ! -x "$host_config" ]; then
            echo "FAIL: $host_config is missing"; fail=1
          else
            reported=$("$host_config" --version 2>/dev/null || true)
            [ "$reported" = "$LLVM_VERSION" ] \
              || { echo "FAIL: octagram-llvm-config reports '$reported'"; fail=1; }
            library_count=$("$host_config" --libs 2>/dev/null | wc -w | tr -d ' ')
            [ "${library_count:-0}" -gt 0 ] \
              || { echo "FAIL: octagram-llvm-config reported no libraries"; fail=1; }
            "$host_config" --libs core support 2>/dev/null | grep -q -- '-lLLVMCore ' \
              || { echo "FAIL: octagram-llvm-config --libs core support is wrong"; fail=1; }
            "$host_config" --libs 2>/dev/null | tr ' ' '\n' | tail -1 | grep -qx -- '-lLLVMDemangle' \
              || { echo "FAIL: leaf libraries are not last in --libs"; fail=1; }
            echo "PASS host-runnable llvm-config: $reported, $library_count libraries"
          fi
          ls -l "$prefix/lib" | head -20
          [ "$fail" -eq 0 ] || exit 1

      - name: Save libLLVM install tree
        # Only a verified install is cached; a partial prefix under this key
        # would make the next run skip the build. A tree that came from the
        # restore-keys fallback is never re-saved under the new key, so an old
        # build can never be presented as the result of these inputs.
        if: >-
          success() &&
          steps.llvm-build.outputs.incomplete != 'true' &&
          steps.llvm-install.outputs.usable != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/toolchain/llvm-${{ env.LLVM_VERSION }}-octagram
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}

      - name: Pack libLLVM install tree
        # actions/upload-artifact does not keep file modes: the tree reaches the
        # rustc job with every file at 0644, so bin/llvm-config is not
        # executable and the bootstrap rejects the install. One archive keeps
        # both the modes and the prefix layout the cache keys assume.
        if: success() && steps.llvm-build.outputs.incomplete != 'true'
        run: |
          set -euo pipefail
          archive="build/toolchain/octagram-llvm-$LLVM_VERSION.tar"
          tar -C build/toolchain -cf "$archive" "llvm-$LLVM_VERSION-octagram"
          ls -l "$archive"

      - name: Upload libLLVM
        if: success() && steps.llvm-build.outputs.incomplete != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: octagram-llvm-${{ env.LLVM_VERSION }}
          path: build/toolchain/octagram-llvm-${{ env.LLVM_VERSION }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  rustc-cargo:
    name: rustc + cargo for x86_64-unknown-octagram
    needs: [preflight, llvm]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (inputs.rustc_mode || 'full') != 'skip' &&
      needs.llvm.outputs.incomplete != 'true'
    runs-on: ubuntu-latest
    # The full bootstrap (stage2 rustc + upstream Cargo for the OCTAGRAM host)
    # is expensive; it runs on pushes to this dedicated branch and manually.
    # Like the llvm job it stops itself at --time-budget, saves the checkout and
    # incremental build directory, and the next run continues from there; the
    # ceiling stays under GitHub's six-hour job limit so the save always runs.
    timeout-minutes: 350
    env:
      LLVM_VERSION: ${{ inputs.llvm_version || '22.1.8' }}
      JOBS: ${{ inputs.jobs || '4' }}
      RUSTC_MODE: ${{ inputs.rustc_mode || 'full' }}
      TIME_BUDGET: ${{ inputs.time_budget || '270' }}
    outputs:
      incomplete: ${{ steps.rustc-build.outputs.incomplete }}
    steps:
      - name: Checkout OCTAGRAM-OS
        uses: actions/checkout@v4

      - name: Checkout pinned upstream libc (target_os = "octagram" module)
        uses: actions/checkout@v4
        with:
          repository: rust-lang/libc
          ref: ${{ env.OCTAGRAM_LIBC_PIN }}
          path: upstream-libc

      - name: Install build dependencies
        run: |
          sudo apt-get update
          major=${LLVM_VERSION%%.*}
          sudo apt-get install -y \
            build-essential g++ binutils lld cmake ninja-build \
            python3 curl git ca-certificates \
            "libpolly-${major}-dev" libz3-dev

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean

      - name: Restore the host LLVM release tarball
        # Ubuntu has no llvm-22-dev, so the runner falls back to the ~1 GB
        # release archive on every run. The archive is immutable for a version,
        # so the key is the version alone and the install below reuses it.
        uses: actions/cache@v4
        with:
          path: build/host-llvm/LLVM-${{ env.LLVM_VERSION }}-Linux-X64.tar.xz
          key: octagram-host-llvm-${{ env.LLVM_VERSION }}

      - name: Install host LLVM for the build platform
        # bootstrap runs llvm-config on the runner while building the compiler
        # for x86_64-unknown-linux-gnu; the OCTAGRAM install only describes the
        # target. The static archives from llvm-<major>-dev are required.
        run: |
          set -euo pipefail
          major=${LLVM_VERSION%%.*}
          find_config() {
            for candidate in "llvm-config-$major" "/usr/lib/llvm-$major/bin/llvm-config"; do
              if command -v "$candidate" >/dev/null 2>&1; then
                echo "$(command -v "$candidate")"; return 0
              fi
              if [ -x "$candidate" ]; then echo "$candidate"; return 0; fi
            done
            return 1
          }
          config=$(find_config || true)
          if [ -z "$config" ]; then
            echo "llvm-$major-dev not installed yet; trying apt"
            sudo apt-get install -y "llvm-$major-dev" || true
            config=$(find_config || true)
          fi
          if [ -z "$config" ]; then
            # The release archive travels through actions/cache (step above), so
            # only the first run pays for the ~1 GB download. A cached file that
            # cannot be unpacked is dropped and fetched once more instead of
            # failing the job.
            tarball="build/host-llvm/LLVM-$LLVM_VERSION-Linux-X64.tar.xz"
            url="https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-Linux-X64.tar.xz"
            mkdir -p "$(dirname "$tarball")"
            for attempt in use-cache download; do
              if [ "$attempt" = download ] || [ ! -f "$tarball" ]; then
                echo "downloading $url"
                rm -f "$tarball"
                curl -fL --retry 3 -o "$tarball.part" "$url"
                mv "$tarball.part" "$tarball"
              fi
              sudo rm -rf /opt/llvm-host
              sudo mkdir -p /opt/llvm-host
              if sudo tar -xJf "$tarball" -C /opt/llvm-host --strip-components=1; then
                break
              fi
              echo "the host LLVM archive could not be unpacked; fetching it again" >&2
              rm -f "$tarball"
            done
            config=/opt/llvm-host/bin/llvm-config
          fi
          [ -x "$config" ] || { echo "FAIL: no host llvm-config" >&2; exit 1; }
          reported=$("$config" --version)
          case "$reported" in
            "$major".*) ;;
            *) echo "FAIL: host LLVM $reported does not match major $major" >&2; exit 1 ;;
          esac
          echo "HOST_LLVM_CONFIG=$config" >> "$GITHUB_ENV"
          echo "host llvm-config: $config ($reported)"

      - name: Validate host LLVM static-link dependencies
        run: |
          set -euo pipefail
          host_config="$HOST_LLVM_CONFIG"
          host_libdir=$("$host_config" --libdir)
          host_libs=$("$host_config" --link-static --libs)
          for lib in Polly PollyISL; do
            if printf '%s\n' "$host_libs" | tr ' ' '\n' | grep -qx -- "-l$lib"; then
              if [ ! -s "$host_libdir/lib$lib.a" ] && [ ! -s "$host_libdir/lib$lib.so" ]; then
                echo "FAIL: host llvm-config requires -l$lib but $host_libdir/lib$lib.a/.so is missing" >&2
                exit 1
              fi
            fi
          done
          system_libs=$(OCTAGRAM_REAL_LLVM_CONFIG="$host_config" python3 tools/host_llvm_config_wrapper.py --link-static --system-libs)
          if printf '%s\n' "$system_libs" | grep -Eq '(^|[[:space:]])-llib[^[:space:]]*\.so([.0-9]*)([[:space:]]|$)'; then
            echo "FAIL: host llvm-config adapter left an invalid -llib*.so flag:" >&2
            echo "$system_libs" >&2
            exit 1
          fi
          if printf '%s\n' "$system_libs" | grep -Eq '(^|[[:space:]])-lz3([[:space:]]|$)'; then
            z3_linker_file=$(cc -print-file-name=libz3.so)
            [ -f "$z3_linker_file" ] || { echo "FAIL: -lz3 requested but libz3-dev linker file is missing" >&2; exit 1; }
          fi
          echo "HOST-LLVM-LINK-INPUTS-PASS"
          echo "host libdir: $host_libdir"
          echo "host system libs: $system_libs"

      - name: Install Rust stage0 toolchain
        run: |
          rustup toolchain install "$OCTAGRAM_RUST_TOOLCHAIN" \
            --profile minimal --component rustfmt
          rustup default "$OCTAGRAM_RUST_TOOLCHAIN"
          rustc -vV

      - name: Download sysroot
        uses: actions/download-artifact@v4
        with:
          name: octagram-sysroot
          path: user/build/sysroot-octagram

      - name: Download libLLVM
        uses: actions/download-artifact@v4
        with:
          name: octagram-llvm-${{ env.LLVM_VERSION }}
          path: build/toolchain

      - name: Extract libLLVM
        # The artifact is the archive packed by the llvm job, so unpacking
        # restores the executable bits and the exact prefix the bootstrap and
        # the install-tree cache key expect.
        run: |
          set -euo pipefail
          archive="build/toolchain/octagram-llvm-$LLVM_VERSION.tar"
          prefix="build/toolchain/llvm-$LLVM_VERSION-octagram"
          rm -rf "$prefix"
          tar -C build/toolchain -xf "$archive"
          rm -f "$archive"
          for tool in llvm-config octagram-llvm-config; do
            [ -x "$prefix/bin/$tool" ] \
              || { echo "FAIL: $prefix/bin/$tool is not executable"; ls -l "$prefix/bin"; exit 1; }
          done
          echo "libLLVM unpacked: $prefix"

      - name: Restore rustc bootstrap checkpoint
        id: rustc-cache
        # The whole checkout travels with its build/ directory: a fresh clone
        # would reset every source mtime and make cargo rebuild from scratch.
        # The key carries the run id, restore-keys picks the newest checkpoint
        # for the same inputs, and any change to the patches or toolchain
        # changes the hash so an incompatible tree is never resumed.
        uses: actions/cache/restore@v4
        with:
          path: build/toolchain/rust
          key: octagram-rust-build-${{ env.LLVM_VERSION }}-${{ hashFiles('tools/bootstrap_rustc_octagram.sh', 'tools/host_llvm_config_wrapper.py', 'tools/apply_rust_libc_octagram.py', 'tools/apply_rust_octagram_host_target.py', 'tools/patch_rust_std_octagram.py', 'tools/patch_getrandom_octagram.py', 'tools/patch_errno_octagram.py', 'tools/patch_tempfile_octagram.py', 'tools/patch_filetime_octagram.py', 'tools/stage_octagram_toolchain.sh', 'patches/rust/**', 'patches/rust-std/**', 'patches/libc/**', 'user/toolchain/**', 'user/include/**', 'user/*.c') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            octagram-rust-build-${{ env.LLVM_VERSION }}-${{ hashFiles('tools/bootstrap_rustc_octagram.sh', 'tools/host_llvm_config_wrapper.py', 'tools/apply_rust_libc_octagram.py', 'tools/apply_rust_octagram_host_target.py', 'tools/patch_rust_std_octagram.py', 'tools/patch_getrandom_octagram.py', 'tools/patch_errno_octagram.py', 'tools/patch_tempfile_octagram.py', 'tools/patch_filetime_octagram.py', 'tools/stage_octagram_toolchain.sh', 'patches/rust/**', 'patches/rust-std/**', 'patches/libc/**', 'user/toolchain/**', 'user/include/**', 'user/*.c') }}-

      - name: Prepare rustc bootstrap
        if: env.RUSTC_MODE == 'prepare-only'
        run: |
          set -euo pipefail
          tools/bootstrap_rustc_octagram.sh \
            --llvm-prefix "build/toolchain/llvm-$LLVM_VERSION-octagram" \
            --host-llvm-config "$HOST_LLVM_CONFIG" \
            --libc-checkout upstream-libc \
            --jobs "$JOBS"

      - name: Build rustc and cargo for OCTAGRAM (time-budgeted, resumable)
        id: rustc-build
        if: env.RUSTC_MODE == 'full'
        env:
          FRESH_BUILD: ${{ inputs.fresh_build }}
        run: |
          set -euo pipefail
          args=(--llvm-prefix "build/toolchain/llvm-$LLVM_VERSION-octagram"
                --host-llvm-config "$HOST_LLVM_CONFIG"
                --libc-checkout upstream-libc
                --jobs "$JOBS"
                --time-budget "$TIME_BUDGET"
                --build)
          if [ -d build/toolchain/rust/.git ]; then
            args+=(--resume)
            echo "RESUME: continuing the restored rust checkout/build directory"
          fi
          if [ "${FRESH_BUILD:-false}" = "true" ]; then
            args+=(--clean)
            echo "FRESH-BUILD: discarding the restored bootstrap tree"
          fi
          status=0
          tools/bootstrap_rustc_octagram.sh "${args[@]}" || status=$?
          if [ "$status" -eq 75 ]; then
            echo "incomplete=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=rustc bootstrap incomplete::Time budget ${TIME_BUDGET}m reached. The bootstrap tree is saved as a checkpoint; run this workflow again to continue from it."
            exit 0
          fi
          echo "incomplete=false" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Check for a rustc checkpoint to save
        id: rustc-checkpoint
        if: always()
        run: |
          if [ -d build/toolchain/rust/build ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            du -sh build/toolchain/rust || true
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save rustc bootstrap checkpoint
        # Only an interrupted bootstrap needs the tree; the staged toolchain is
        # the finished product. Cache storage is 10 GB per repository by
        # default, so keep one tree per inputs hash and do not fail the run if
        # the save is refused.
        if: >-
          always() &&
          steps.rustc-build.outputs.incomplete == 'true' &&
          steps.rustc-checkpoint.outputs.present == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/toolchain/rust
          key: ${{ steps.rustc-cache.outputs.cache-primary-key }}

      - name: Verify staged toolchain
        if: success() && env.RUSTC_MODE == 'full' && steps.rustc-build.outputs.incomplete != 'true'
        run: |
          set -euo pipefail
          stage=build/toolchain/octagram-toolchain
          test -s "$stage/toolchain.json"
          cat "$stage/toolchain.json"
          for tool in rustc cargo; do
            binary="$stage/bin/$tool"
            [ -f "$binary" ] || { echo "FAIL: $binary missing"; exit 1; }
            header=$(readelf -h "$binary")
            echo "$header" | grep -q 'Type:.*EXEC (' \
              || { echo "FAIL: $tool is not ET_EXEC"; exit 1; }
            echo "$header" | grep -q 'Machine:.*X86-64' \
              || { echo "FAIL: $tool is not x86-64"; exit 1; }
            if readelf -l "$binary" | grep -q 'INTERP'; then
              echo "FAIL: $tool has a PT_INTERP"; exit 1
            fi
            echo "PASS static OCTAGRAM ELF: $tool"
          done
          test -d "$stage/lib/rustlib" \
            || { echo "FAIL: rustlib missing"; exit 1; }
          echo "TOOLCHAIN-VERIFY-PASS"

      - name: Upload rustc + cargo
        if: success() && env.RUSTC_MODE == 'full' && steps.rustc-build.outputs.incomplete != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: octagram-toolchain
          path: build/toolchain/octagram-toolchain
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  status-summary:
    name: Toolchain status summary
    runs-on: ubuntu-latest
    needs: [preflight, llvm, rustc-cargo]
    if: always()
    steps:
      - name: Report job results
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          LLVM_RESULT: ${{ needs.llvm.result }}
          LLVM_INCOMPLETE: ${{ needs.llvm.outputs.incomplete }}
          RUSTC_RESULT: ${{ needs.rustc-cargo.result }}
          RUSTC_INCOMPLETE: ${{ needs.rustc-cargo.outputs.incomplete }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "STATUS event=${EVENT}"
          echo "STATUS preflight=${PREFLIGHT_RESULT}"
          # skipped = build tidak diminta untuk event ini, bukan gagal.
          incomplete=0
          if [ "${LLVM_RESULT}" = "success" ] && [ "${LLVM_INCOMPLETE}" = "true" ]; then
            incomplete=1
            echo "STATUS llvm=incomplete (batas waktu tercapai; checkpoint tersimpan)"
          else
            echo "STATUS llvm=${LLVM_RESULT}"
          fi
          if [ "${RUSTC_RESULT}" = "success" ] && [ "${RUSTC_INCOMPLETE}" = "true" ]; then
            incomplete=1
            echo "STATUS rustc-cargo=incomplete (batas waktu tercapai; checkpoint tersimpan)"
          else
            echo "STATUS rustc-cargo=${RUSTC_RESULT}"
          fi
          echo "STATUS guest-runtime=not-run (butuh QEMU; lihat docs/rust-llvm-octagram-build.md)"
          if [ "${PREFLIGHT_RESULT}" != "success" ]; then
            echo "STATUS overall=failed"
            exit 1
          fi
          for result in "${LLVM_RESULT}" "${RUSTC_RESULT}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "STATUS overall=failed"; exit 1 ;;
            esac
          done
          if [ "$incomplete" -eq 1 ]; then
            # Bukan kegagalan: jalankan workflow lagi untuk melanjutkan dari
            # checkpoint, bukan dari nol.
            echo "STATUS overall=incomplete (jalankan ulang untuk melanjutkan)"
            echo "::warning title=Build belum selesai::Checkpoint tersimpan. Jalankan workflow ini lagi untuk melanjutkan build dari titik terakhir."
            exit 0
          fi
          echo "STATUS overall=passed"
