name: POSIX Core Stage 1

on:
  push:
    branches:
      - feature/posix-core-stage1
      - feature/persistent-root-install
      - feature/native-self-hosting
  pull_request:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-build-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils nasm lld xorriso mtools gdisk qemu-system-x86 python3 curl git

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --component rustfmt --target x86_64-unknown-none
          rustup default nightly

      - name: Check formatting
        # The imported trunk code currently has repository-wide rustfmt drift.
        # Keep this diagnostic visible without blocking compilation and tests.
        continue-on-error: true
        run: cargo +nightly fmt --manifest-path kernel/Cargo.toml --check

      # kernel/src/fs/mod.rs embeds these artifacts with include_bytes!,
      # so create them before invoking cargo test or compilation fails early.
      - name: Build embedded Rust utility
        run: make -C user/rust make

      - name: Build user programs
        run: make -C user

      - name: Build dynamic userland
        run: make -C user dynamic

      - name: Run kernel host tests
        run: cargo +nightly test --manifest-path kernel/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Run libc host tests
        run: |
          make -C user scanf-test
          make -C user cxa-test
          make -C user resolv-test
          make -C user ipv6-test

      - name: Build kernel
        run: make -C kernel KARCH=x86_64

      - name: Build bootable ISO
        run: make all

      - name: Inspect native TinyCC fault location
        if: always()
        run: |
          if [ -f user/build/tcc.elf ]; then
            echo "TinyCC ELF headers and entry point:"
            readelf -h user/build/tcc.elf
            echo "Instructions around the guest fault address 0x402a2e:"
            objdump -d --start-address=0x402a00 --stop-address=0x402a60 user/build/tcc.elf || true
          else
            echo "TinyCC guest ELF was not produced at user/build/tcc.elf"
          fi

      - name: QEMU native TinyCC compile and run smoke test
        shell: bash
        run: |
          rm -f /tmp/serial-tcc.log /tmp/mon-tcc.sock
          qemu-system-x86_64 \
            -M q35 \
            -cdrom OCTAGRAM-x86_64.iso \
            -boot d \
            -m 2G \
            -display none \
            -serial file:/tmp/serial-tcc.log \
            -monitor unix:/tmp/mon-tcc.sock,server,nowait \
            -no-reboot -no-shutdown \
            >/tmp/qemu-tcc.stderr 2>&1 &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true' EXIT
          MON=/tmp/mon-tcc.sock SERIAL=/tmp/serial-tcc.log python3 tools/qemu_tcc_selfhost_test.py

      - name: QEMU syscall compatibility smoke test
        shell: bash
        run: |
          rm -f /tmp/serial.log /tmp/mon.sock
          qemu-system-x86_64 \
            -M q35 \
            -cdrom OCTAGRAM-x86_64.iso \
            -boot d \
            -m 2G \
            -display none \
            -serial file:/tmp/serial.log \
            -monitor unix:/tmp/mon.sock,server,nowait \
            -no-reboot -no-shutdown \
            >/tmp/qemu.stderr 2>&1 &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true' EXIT
          python3 tools/qemu_syscall_test.py
