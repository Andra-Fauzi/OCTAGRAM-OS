name: POSIX Core Stage 1

on:
  push:
    branches:
      - feature/posix-core-stage1
      - feature/persistent-root-install
      - feature/native-self-hosting
      - feature/native-self-hosting-testing-3
      - feature/native-self-hosting-testing-4
  pull_request:
    branches:
      - trunk
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OCTAGRAM_RUST_TOOLCHAIN: nightly-2026-11-23

permissions:
  contents: read

jobs:
  host-build-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned GNU Make upstream source
        run: python3 tools/check_gnu_make_source.py

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils nasm lld xorriso mtools gdisk qemu-system-x86 python3 curl git autoconf automake autopoint gettext perl texinfo

      - name: Install pinned Rust nightly
        run: |
          rustup toolchain install "$OCTAGRAM_RUST_TOOLCHAIN" --profile minimal --component rustfmt --component rust-src --target x86_64-unknown-none
          rustup default "$OCTAGRAM_RUST_TOOLCHAIN"
          rustc -vV

      - name: Checkout pinned upstream Rust libc
        uses: actions/checkout@v4
        with:
          repository: rust-lang/libc
          ref: ccc2ff4aaab962f7fde7b8edda7379c045b1ca12
          path: upstream-libc

      - name: Prepare upstream Rust std for OCTAGRAM
        run: |
          set -euo pipefail
          python3 tools/apply_rust_libc_octagram.py upstream-libc
          python3 tools/patch_rust_std_octagram.py


      - name: Check formatting
        # The imported trunk code currently has repository-wide rustfmt drift.
        # Keep this diagnostic visible without blocking compilation and tests.
        continue-on-error: true
        run: cargo "+$OCTAGRAM_RUST_TOOLCHAIN" fmt --manifest-path kernel/Cargo.toml --check

      - name: Validate experimental OCTAGRAM Rust host target
        run: python3 tools/check_octagram_rust_target.py

      - name: Compile no_std runtime for experimental OCTAGRAM host target
        run: |
          cargo "+$OCTAGRAM_RUST_TOOLCHAIN" -Z build-std=core,alloc -Z json-target-spec build \
            --manifest-path user/rust/Cargo.toml \
            --package octagram-runtime \
            --release \
            --target user/rust/targets/x86_64-unknown-octagram.json

      # kernel/src/fs/mod.rs embeds these artifacts with include_bytes!,
      # so create them before invoking cargo test or compilation fails early.
      - name: Compile no_std + alloc probe for experimental OCTAGRAM host target
        run: |
          cargo "+$OCTAGRAM_RUST_TOOLCHAIN" -Z build-std=core,alloc -Z json-target-spec build \
            --manifest-path user/rust/Cargo.toml \
            --package octagram-alloc-probe \
            --release \
            --target user/rust/targets/x86_64-unknown-octagram.json

      - name: Build executable for experimental OCTAGRAM Rust target
        run: make -C user/rust build-octagram

      - name: Test custom-target Rust ELF verifier
        run: python3 tools/test_check_rust_octagram_elf.py

      - name: Validate Rust host ABI dependency matrix
        run: python3 tools/check_rust_host_abi_matrix.py

      - name: Verify custom-target Rust ELF is self-contained
        run: python3 tools/check_rust_octagram_elf.py

      - name: Test Rust runtime freestanding memory ABI
        run: |
          cargo "+$OCTAGRAM_RUST_TOOLCHAIN" test \
            --manifest-path user/rust/Cargo.toml \
            --package octagram-runtime \
            --target x86_64-unknown-linux-gnu

      - name: Build embedded Rust utility
        run: make -C user/rust all

      - name: Build user programs
        # The default Make target is an individual object; the kernel embeds
        # the complete userland smoke-test set with include_bytes!.
        run: make -C user all

      - name: Build upstream Rust std executable for OCTAGRAM
        env:
          RUSTC_BOOTSTRAP_SYNTHETIC_TARGET: "1"
        run: |
          set -euo pipefail
          test -s user/build/libc.a
          # rustc's Unix target defaults request these four system libraries.
          # OCTAGRAM currently supplies their ABI from one static libc archive.
          ln -sf libc.a user/build/libm.a
          ln -sf libc.a user/build/librt.a
          ln -sf libc.a user/build/libpthread.a
          nm -g --defined-only user/build/libc.a | grep -q __oct_tls_initialize
          mkdir -p user/rust/build
          as --64 -o user/rust/build/crt0.o user/crt0.S
          export RUSTFLAGS="-C linker=ld.lld -C link-arg=-T$GITHUB_WORKSPACE/user/linker.ld -C link-arg=$GITHUB_WORKSPACE/user/rust/build/crt0.o -C link-arg=-u -C link-arg=__oct_tls_initialize -C link-arg=-L$GITHUB_WORKSPACE/user/build"
          cargo "+$OCTAGRAM_RUST_TOOLCHAIN" -Zjson-target-spec -Zbuild-std=std build --release \
            --manifest-path user/rust/std-probe/Cargo.toml \
            --target user/rust/targets/x86_64-unknown-octagram.json \
            --target-dir user/rust/std-probe/target \
            --config 'patch.crates-io.libc.path="upstream-libc"'
          install -m 0755 \
            user/rust/std-probe/target/x86_64-unknown-octagram/release/octagram-std-probe \
            user/rust/build/rust_std_probe.elf
          readelf -h user/rust/build/rust_std_probe.elf
          readelf -l user/rust/build/rust_std_probe.elf
          # Diagnose the exact TLS symbol offsets and initialized template bytes.
          readelf -SW user/rust/build/rust_std_probe.elf
          readelf -sW user/rust/build/rust_std_probe.elf | grep -Ei 'TLS|thread_local|RUST_TLS|oct_tls' || true
          objdump -s -j .tdata user/rust/build/rust_std_probe.elf || true
          objdump -s -j .tbss user/rust/build/rust_std_probe.elf || true
          nm -an user/rust/build/rust_std_probe.elf | grep -Ei 'TLS|thread_local|RUST_TLS|oct_tls' || true

      - name: Verify every Rust std probe marker is covered by QEMU
        run: python3 tools/check_rust_std_probe_markers.py

      - name: Cross-build upstream GNU Make for OCTAGRAM
        run: bash tools/build_gnu_make_octagram.sh

      - name: Build dynamic userland
        run: make -C user dynamic

      - name: Run kernel host tests
        run: cargo "+$OCTAGRAM_RUST_TOOLCHAIN" test --manifest-path kernel/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Run libc host tests
        run: |
          make -C user scanf-test
          make -C user cxa-test
          make -C user resolv-test
          make -C user ipv6-test
          make -C user overflow-test
          make -C user wctype-test
          make -C user compiler-rt-test
          make -C user cpp-header-test
          make -C user libcxx-header-check
          make -C user math-test
          make -C user math-header-test
          make -C user stdint-test
          make -C user wait-status-test

      - name: Build kernel
        run: make -C kernel KARCH=x86_64

      - name: Build bootable ISO
        run: make all

      - name: Inspect native TinyCC fault location
        if: always()
        run: |
          if [ -f user/build/tcc.elf ]; then
            echo "TinyCC ELF headers and entry point:"
            readelf -h user/build/tcc.elf
            echo "Instructions around the guest fault address 0x402a2e:"
            objdump -d --start-address=0x402a00 --stop-address=0x402a60 user/build/tcc.elf || true
            echo "Checking decoded instructions in the executable .text section for AVX/VEX mnemonics..."
            # Never scan raw bytes: values such as 0x62/c4/c5 also occur in
            # strings, tables, and other non-code data. Restrict objdump to
            # .text and inspect its decoded mnemonic column. Exclude legacy
            # virtualization mnemonics beginning with 'v' (e.g. vmcall).
            if objdump -d -j .text user/build/tcc.elf | awk -F '\\t' '
              NF >= 3 {
                split($3, instruction, /[[:space:]]+/)
                mnemonic = instruction[1]
                if (mnemonic ~ /^v[a-zA-Z0-9]+$/ &&
                    mnemonic !~ /^(verr|verw|vmcall|vmlaunch|vmresume|vmrun|vmsave|vmmcall)$/) {
                  print
                  found = 1
                }
              }
              END { exit(found ? 0 : 1) }
            '; then
              echo "ERROR: decoded AVX/VEX instruction found in TinyCC .text."
              exit 1
            fi
            echo "TinyCC .text contains no decoded AVX/VEX instructions."
          else
            echo "TinyCC guest ELF was not produced at user/build/tcc.elf"
          fi
          if [ -f user/build/gnu-make-octagram/make ]; then
            echo "GNU Make ELF headers and entry point:"
            readelf -h user/build/gnu-make-octagram/make
            echo "GNU Make full main() disassembly to locate the source of the bad r15 value:"
            objdump -d --disassemble=main user/build/gnu-make-octagram/make || true
            echo "GNU Make guile_gmake_setup() disassembly:"
            objdump -d --disassemble=guile_gmake_setup user/build/gnu-make-octagram/make || true
            echo "GNU Make relevant function symbols:"
            nm -n user/build/gnu-make-octagram/make | grep -E "main|guile_gmake_setup" || true
            echo "GNU Make focused instructions around the observed guest fault 0x4134ee:"
            objdump -d --start-address=0x4134c0 --stop-address=0x413520 user/build/gnu-make-octagram/make || true
          else
            echo "GNU Make guest ELF was not produced"
          fi
      - name: Check build artifact manifest
        run: make manifest-check

      - name: Upload bootable ISO for guest tests
        uses: actions/upload-artifact@v4
        with:
          name: octagram-iso
          path: OCTAGRAM-x86_64.iso
          if-no-files-found: error
          retention-days: 7

  # Status QEMU dipisahkan dari status build host: kegagalan guest test tidak
  # menyembunyikan hasil kompilasi dan unit test host, dan sebaliknya.
  qemu-smoke-tests:
    runs-on: ubuntu-latest
    needs: host-build-and-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 python3

      - name: Download bootable ISO
        uses: actions/download-artifact@v4
        with:
          name: octagram-iso
          path: .

      - name: QEMU native TinyCC compile and run smoke test
        shell: bash
        run: |
          rm -f /tmp/serial-tcc.log /tmp/mon-tcc.sock
          qemu-system-x86_64 \
            -M q35 \
            -cdrom OCTAGRAM-x86_64.iso \
            -boot d \
            -m 2G \
            -display none \
            -serial file:/tmp/serial-tcc.log \
            -monitor unix:/tmp/mon-tcc.sock,server,nowait \
            -no-reboot -no-shutdown \
            >/tmp/qemu-tcc.stderr 2>&1 &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true' EXIT
          MON=/tmp/mon-tcc.sock SERIAL=/tmp/serial-tcc.log python3 tools/qemu_tcc_selfhost_test.py

      - name: QEMU syscall compatibility smoke test
        shell: bash
        run: |
          rm -f /tmp/serial.log /tmp/mon.sock
          qemu-system-x86_64 \
            -M q35 \
            -cdrom OCTAGRAM-x86_64.iso \
            -boot d \
            -m 2G \
            -display none \
            -serial file:/tmp/serial.log \
            -monitor unix:/tmp/mon.sock,server,nowait \
            -no-reboot -no-shutdown \
            >/tmp/qemu.stderr 2>&1 &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true' EXIT
          python3 tools/qemu_syscall_test.py

  # Ringkasan tiga tingkat status yang diminta kontrak M0: build host, QEMU, dan
  # hardware. Hardware tidak dijalankan di runner tanpa mesin fisik; statusnya
  # dilaporkan eksplisit, bukan dianggap lulus.
  status-summary:
    runs-on: ubuntu-latest
    needs: [host-build-and-tests, qemu-smoke-tests]
    if: always()
    steps:
      - name: Report host, QEMU, and hardware status
        env:
          HOST_RESULT: ${{ needs.host-build-and-tests.result }}
          QEMU_RESULT: ${{ needs.qemu-smoke-tests.result }}
        run: |
          echo "STATUS build-host=${HOST_RESULT}"
          echo "STATUS qemu=${QEMU_RESULT}"
          echo "STATUS hardware=not-run (tidak ada runner hardware di CI)"
          echo "STATUS manifest=build/manifest.json (diperiksa oleh make manifest-check)"
          if [ "${HOST_RESULT}" != "success" ] || [ "${QEMU_RESULT}" != "success" ]; then
            echo "STATUS overall=failed"
            exit 1
          fi
          echo "STATUS overall=passed"

