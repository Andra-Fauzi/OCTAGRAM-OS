name: Rust no_std userspace

on:
  push:
    branches:
      - feature/native-self-hosting
    paths:
      - "user/rust/**"
      - "user/crt0.S"
      - "user/include/**"
      - "user/runtime.c"
      - "tools/rust_libc_abi_surface.json"
      - "tools/check_rust_libc_abi_surface.py"
      - "patches/rust-libc/**"
      - "tools/rust_std_pal_api_inventory.json"
      - "tools/check_rust_std_pal_api_inventory.py"
      - ".github/workflows/rust-no-std.yml"
  pull_request:
    paths:
      - "user/rust/**"
      - "user/crt0.S"
      - "user/include/**"
      - "user/runtime.c"
      - "tools/rust_libc_abi_surface.json"
      - "tools/check_rust_libc_abi_surface.py"
      - "tools/rust_std_pal_api_inventory.json"
      - "tools/check_rust_std_pal_api_inventory.py"
      - ".github/workflows/rust-no-std.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rust-userspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils lld make

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt

      - name: Validate custom target specification and Unix cfg
        run: python3 tools/check_octagram_rust_target.py

      - name: Validate OCTAGRAM libc ABI surface for upstream Rust port
        run: python3 tools/check_rust_libc_abi_surface.py

      - name: Validate selected Rust std Unix PAL APIs
        run: python3 tools/check_rust_std_pal_api_inventory.py

      - name: Checkout pinned upstream libc
        uses: actions/checkout@v4
        with:
          repository: rust-lang/libc
          ref: a03dd7c2e298b0ca482f30ce07efd3115938328e
          path: upstream-libc

      - name: Apply and compile OCTAGRAM upstream libc target
        run: |
          set -euo pipefail
          cd upstream-libc
          git apply --ignore-whitespace --check ../patches/rust-libc/0001-add-octagram-abi.patch
          git apply --ignore-whitespace ../patches/rust-libc/0001-add-octagram-abi.patch
          cd ..
          cargo +nightly -Zjson-target-spec -Zbuild-std=core check \
            --manifest-path upstream-libc/Cargo.toml \
            --target user/rust/targets/x86_64-unknown-octagram.json \
            --no-default-features --features rustc-dep-of-std

      - name: Build OCTAGRAM Rust binaries
        run: make -C user/rust clean all check

      - name: Run runtime unit tests on host
        run: cargo +nightly test --manifest-path user/rust/Cargo.toml -p octagram-runtime --lib --target x86_64-unknown-linux-gnu

      - name: Verify ELF output
        shell: bash
        run: |
          set -euo pipefail
          for elf in user/rust/build/rust_hello.elf user/rust/build/make.elf; do
            test -s "$elf"
            file "$elf"
            header="$(readelf -h "$elf")"
            grep -Eq 'Type:[[:space:]]+EXEC' <<< "$header"
            grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64' <<< "$header"
            if readelf -l "$elf" | grep -q 'INTERP'; then
              echo "Unexpected dynamic interpreter in $elf" >&2
              exit 1
            fi
            readelf -l "$elf"
          done
