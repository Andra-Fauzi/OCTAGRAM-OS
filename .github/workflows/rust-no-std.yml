name: Rust no_std userspace

on:
  push:
    branches:
      - feature/native-self-hosting
    paths:
      - "user/rust/**"
      - "user/crt0.S"
      - ".github/workflows/rust-no-std.yml"
  pull_request:
    paths:
      - "user/rust/**"
      - "user/crt0.S"
      - ".github/workflows/rust-no-std.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rust-userspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils lld make

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt

      - name: Build OCTAGRAM Rust binaries
        run: make -C user/rust clean all check

      - name: Run runtime unit tests on host
        run: cargo +nightly test --manifest-path user/rust/Cargo.toml -p octagram-runtime --target x86_64-unknown-linux-gnu

      - name: Verify ELF output
        run: |
          file user/rust/build/rust_hello.elf user/rust/build/make.elf
          readelf -h user/rust/build/rust_hello.elf
          readelf -l user/rust/build/rust_hello.elf
