[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
linker = "ld.lld"
rustflags = [
    "-C",
    "relocation-model=static",
    "-C",
    "no-redzone=yes",
    "-C",
    "target-feature=-sse,-sse2",
    "-C",
    "link-arg=-Tlinker.ld",
    "-C",
    "link-arg=build/crt0.o",
]

# Host-side codegen for OCTAGRAM target crates.
#
# Only code generation flags live here on purpose. The link-time arguments
# (`-T user/linker.ld`, `user/build/crt0.o`, the guest `libc.a`) must be
# absolute paths, because rustc resolves `link-arg` values relative to the
# directory it is invoked from, which for cargo is the package directory.
# tools/build_octagram_std_probe.sh therefore supplies those arguments through
# CARGO_ENCODED_RUSTFLAGS, which replaces these flags instead of appending to
# them.
[target.x86_64-unknown-octagram]
rustflags = [
    "-C",
    "relocation-model=static",
    "-C",
    "no-redzone=yes",
    "-C",
    "target-feature=+sse,+sse2",
]
