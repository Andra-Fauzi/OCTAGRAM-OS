[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
linker = "ld.lld"
rustflags = [
    "-C",
    "relocation-model=static",
    "-C",
    "no-redzone=yes",
    "-C",
    "target-feature=-sse,-sse2",
    "-C",
    "link-arg=-Tlinker.ld",
    "-C",
    "link-arg=build/crt0.o",
]

# Host-side codegen and link setup for OCTAGRAM target crates.
#
# `linker.ld` and `build/crt0.o` are relative on purpose: cargo runs rustc with
# the directory it was started in, so these resolve when the build runs from
# user/rust (which is what user/rust/Makefile does, and that Makefile copies the
# linker script in from the parent tree). Tools that build from another working
# directory pass absolute paths instead -- see tools/build_octagram_std_probe.sh.
[target.x86_64-unknown-octagram]
linker = "rust-lld"
rustflags = [
    "-C",
    "relocation-model=static",
    "-C",
    "no-redzone=yes",
    "-C",
    "target-feature=+sse,+sse2",
    "-C",
    "link-arg=-Tlinker.ld",
    "-C",
    "link-arg=build/crt0.o",
]
